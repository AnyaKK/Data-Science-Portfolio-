name: Portfolio CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  epidemiology-methods:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r projects/epidemiology-ml-methods/requirements.txt

      - name: Run epidemiology methods tests
        run: python -m pytest -q projects/epidemiology-ml-methods/tests
